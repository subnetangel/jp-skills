<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Lay out like a borrowed laptop: Chromium sees only the system fonts and the fonts embedded in the page.
     Use with every layout check:  export FONTCONFIG_FILE=$PWD/templates/fonts-embedded-only.conf
     Replace BRAND with your brand font's file glob and family names (one <pattern> per family). The user's own font
     folder (~/.fonts, ~/.local/share/fonts), where a designer's machine has the brand faces installed, is left out. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/fontconfig-embedded-only</cachedir>
  <selectfont>
    <rejectfont>
      <glob>*BRAND*</glob>
      <pattern><patelt name="family"><string>BRAND Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>BRAND Mono</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
