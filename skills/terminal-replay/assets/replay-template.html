<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<!-- Built by scripts/build_replay.py from a session script. One file: no fonts, scripts or images are fetched.
     URL options: ?speed=2  ?theme=light|dark  ?step  ?autoplay=0  ?scene=<id>   Keys: Space play/pause, L theme -->
<script>
(function () { var q = new URLSearchParams(location.search), t = q.get('theme');
  if (!t) { try { t = localStorage.getItem('tp-theme'); } catch (e) {} }
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<style>
{{css}}
html,body{margin:0;height:100%;background:var(--tp-bg);color:var(--tp-text);font-family:var(--tp-sans)}
.page{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0}
.head .sub{color:var(--tp-muted);font-size:14px}
.head .theme{margin-left:auto}
#player{height:min(68vh,640px)}
details{background:var(--tp-surface);border:1px solid var(--tp-line);border-radius:10px;padding:8px 14px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;margin:8px 0;font-size:14px}
th,td{text-align:left;padding:3px 14px 3px 0;border-bottom:1px solid var(--tp-line)}
td.n{font-family:var(--tp-mono);text-align:right}
.foot{color:var(--tp-muted);font-size:13px}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <h1>{{title}}</h1><span class="sub">{{label}}</span>
    <button class="tp-btn theme" id="theme" type="button" aria-label="Switch light or dark theme">Theme (L)</button>
  </div>
  <div id="player"></div>
  <details>
    <summary>Timing table (main path, speed <span id="spd">1</span>×)</summary>
    <table><thead><tr><th>Scene</th><th>Stage</th><th>Seconds</th></tr></thead><tbody id="tbody"></tbody></table>
    <p class="foot">Estimated from the script: characters typed at the set rate, one output line per tick, pauses as
    written. Space plays or pauses; Step shows one line per press.</p>
  </details>
  <p class="foot">{{footer}}</p>
</div>
<script>
{{js}}
</script>
<script>
(function () {
  var SESSION = {{session}};
  var q = new URLSearchParams(location.search);
  var speed = Math.max(0.1, Math.min(20, parseFloat(q.get('speed')) || 1));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var p = TermPlayer.mount(document.getElementById('player'), SESSION,
    { speed: speed, autoplay: q.get('autoplay') !== '0', reducedMotion: reduce, start: false });
  if (q.has('step')) p.setStep(true);
  if (q.get('scene')) p.goto(q.get('scene')); else p.restart();
  document.getElementById('spd').textContent = speed;
  var tb = document.getElementById('tbody'), total = 0;
  TermPlayer.timing(SESSION, speed).forEach(function (r) {
    total += r.ms; var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + r.id + '</td><td>' + r.stage + '</td><td class="n">' + (r.ms / 1000).toFixed(1) + '</td>';
    tb.appendChild(tr);
  });
  var tr = document.createElement('tr'); tr.innerHTML = '<td><b>Total</b></td><td></td><td class="n"><b>' + (total / 1000).toFixed(1) + '</b></td>'; tb.appendChild(tr);
  function theme() { var r = document.documentElement, t = r.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    r.setAttribute('data-theme', t); try { localStorage.setItem('tp-theme', t); } catch (e) {} }
  document.getElementById('theme').addEventListener('click', theme);
  addEventListener('keydown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button,input,textarea')) return;
    if (e.key === 'l' || e.key === 'L') theme();
    else if (e.key === ' ') { e.preventDefault(); p.toggle(); }
  });
})();
</script>
</body>
</html>
